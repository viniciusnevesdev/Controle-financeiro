name: Atualizar Meu Dinheiro no GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "source/**"
      - "tools/**"
      - "apply_icon_overrides.py"
      - "beta-tools.js"
      - "prepare_environments.py"
      - "manual_pwa_hardening.py"
      - "generate_valid_pwa_icons.py"
      - "verify_site.py"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages-meu-dinheiro"
  cancel-in-progress: true

env:
  STABLE_RELEASE: "1.1.4"
  BETA_LABEL: "1.2.0-beta.${{ github.run_number }}"
  PUBLIC_BASE: "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"

jobs:
  build-publish-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o desenvolvimento atual
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Baixar a versão Oficial congelada
        uses: actions/checkout@v4
        with:
          ref: stable
          path: _stable
          persist-credentials: false

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            source/package-lock.json
            _stable/source/package-lock.json

      - name: Aplicar substituições globais de ícones
        run: |
          cp source/icon-overrides.json _stable/source/icon-overrides.json
          python3 apply_icon_overrides.py source/src/Icon.tsx source/icon-overrides.json
          python3 apply_icon_overrides.py _stable/source/src/Icon.tsx _stable/source/icon-overrides.json

      - name: Preservar o ícone próprio da Beta
        run: cp beta/apple-touch-icon.png source/public/apple-touch-icon.png

      - name: Compilar a versão Beta
        working-directory: source
        run: |
          npm ci
          npm run build

      - name: Compilar a versão Oficial
        working-directory: _stable/source
        run: |
          npm ci
          npm run build

      - name: Atualizar os arquivos compilados da Beta
        run: |
          find assets -type f -delete
          cp -R source/dist/assets/. assets/
          cp source/dist/index.html index.html
          cp source/dist/manifest.webmanifest manifest.webmanifest
          cp source/dist/apple-touch-icon.png apple-touch-icon.png
          cp source/dist/icon.svg icon.svg
          cp source/dist/sw.js sw.js

      - name: Atualizar os arquivos compilados da Oficial congelada
        run: |
          find _stable/assets -type f -delete
          cp -R _stable/source/dist/assets/. _stable/assets/
          cp _stable/source/dist/index.html _stable/index.html
          cp _stable/source/dist/manifest.webmanifest _stable/manifest.webmanifest
          cp _stable/source/dist/apple-touch-icon.png _stable/apple-touch-icon.png
          cp _stable/source/dist/icon.svg _stable/icon.svg
          cp _stable/source/dist/sw.js _stable/sw.js

      - name: Montar Oficial, Beta, menu e ferramentas
        run: python3 prepare_environments.py

      - name: Publicar editor global de ícones
        run: |
          mkdir -p _site/icon-editor
          cp tools/icon-editor/index.html _site/icon-editor/index.html
          cp source/icon-overrides.json _site/icon-editor/icon-overrides.json

      - name: Aplicar ícones aprovados no Menu Geral
        run: |
          mkdir -p _site/icons _site/beta/icons
          cp source/public/brand-icons/icon-finance-20260911.jpg _site/icons/icon-finance-20260911.jpg
          cp source/public/brand-icons/icon-menu-20260911.jpg _site/icons/icon-menu-20260911.jpg
          cp source/public/brand-icons/icon-beta-20260911.jpg _site/beta/icons/icon-beta-20260911.jpg
          python3 - <<'PY'
          from pathlib import Path
          files = [Path('_site/menu.html'), Path('_site/menu/index.html')]
          for path in files:
              text = path.read_text(encoding='utf-8')
              is_alias = path.parent.name == 'menu'
              p = '../' if is_alias else './'
              text = text.replace(f'{p}icons/menu.svg', f'{p}icons/icon-menu-20260911.jpg?v=20260911')
              text = text.replace(f'{p}beta/apple-touch-icon.png', f'{p}beta/icons/icon-beta-20260911.jpg?v=20260911')
              text = text.replace(f'{p}apple-touch-icon.png', f'{p}icons/icon-finance-20260911.jpg?v=20260911')
              text = text.replace('type="image/svg+xml"', 'type="image/jpeg"', 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Preparar e preservar os ícones PWA
        run: |
          python3 -m pip install --quiet pillow
          python3 -m py_compile apply_icon_overrides.py generate_valid_pwa_icons.py manual_pwa_hardening.py verify_site.py
          python3 generate_valid_pwa_icons.py
          python3 manual_pwa_hardening.py

      - name: Remover avisos de dados de demonstração
        run: |
          python3 - <<'PY'
          from pathlib import Path
          style = '<style data-hide-demo-notice>.header-demo-info{display:none!important}</style>'
          for path in (Path('_site/index.html'), Path('_site/beta/index.html')):
              text = path.read_text(encoding='utf-8')
              if 'data-hide-demo-notice' not in text:
                  text = text.replace('</head>', style + '\n</head>', 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Testar arquivos, links, dados separados e ícones
        run: python3 verify_site.py _site

      - name: Sincronizar o site com a raiz publicada
        run: |
          rm -rf beta diagnostico menu icons icon-editor
          cp -a _site/. ./
          rm -rf _site _stable

          git add -A -- \
            .nojekyll 404.html index.html manifest.webmanifest sw.js \
            icon.svg apple-touch-icon.png assets beta diagnostico menu icons icon-editor \
            central.html menu.html launch.html recover.html safe.html \
            environment.json ambientes.json

          if git diff --cached --quiet; then
            echo "O site publicado já está atualizado."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Atualizar site publicado"
          git push

      - name: Conferir os endereços públicos
        run: |
          fetch_public() {
            local url="$1"
            local expected="$2"
            local out
            out=$(mktemp)
            for attempt in {1..30}; do
              code=$(curl -L -sS -o "$out" -w '%{http_code}' --connect-timeout 10 --max-time 20 "$url" || true)
              if [ "$code" = "200" ] && grep -q "$expected" "$out"; then
                echo "[OK] $url"
                return 0
              fi
              echo "[$attempt/30] aguardando $url (HTTP $code)"
              sleep 5
            done
            echo "FALHA: $url não publicou o conteúdo esperado."
            return 1
          }

          fetch_public "$PUBLIC_BASE/" 'app-environment.*official'
          fetch_public "$PUBLIC_BASE/menu.html" 'finance-tools-page.*menu'
          fetch_public "$PUBLIC_BASE/beta/" 'app-environment.*beta'
          fetch_public "$PUBLIC_BASE/icon-editor/" 'Editor global de ícones'
          fetch_public "$PUBLIC_BASE/diagnostico/" 'Diagnóstico'
          fetch_public "$PUBLIC_BASE/safe.html" 'Modo seguro'
          fetch_public "$PUBLIC_BASE/beta/safe.html" 'Modo seguro'
