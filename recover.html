<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f7f4"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><meta name="robots" content="noindex,nofollow"><link rel="icon" href="./icons/recover.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="./apple-touch-icon.png"><title>Meu Dinheiro · Recuperação</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f6f7f4;color:#111512;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif}main{min-height:100dvh;display:grid;place-items:center;padding:24px}section{width:min(100%,390px);background:#fff;border-radius:24px;padding:22px;box-shadow:0 10px 30px rgba(0,0,0,.07)}.top{display:flex;gap:13px;align-items:center}.top img{width:54px;height:54px}h1{font-size:22px;margin:0}p{font-size:14px;line-height:1.48;color:#6b726e}.notice{padding:11px 12px;border-radius:14px;background:#fff6e8;color:#86520a;font-size:12px;line-height:1.4}.ok{color:#24843f}.bad{color:#d83a2e}.bar{height:6px;background:#e5e9e6;border-radius:999px;overflow:hidden;margin:18px 0}.bar span{display:block;height:100%;width:18%;background:#ff9f0a;border-radius:inherit;animation:move .9s ease-in-out infinite alternate}@keyframes move{to{transform:translateX(430%)}}.actions{display:grid;gap:9px;margin-top:16px}.actions a{text-decoration:none;text-align:center;padding:12px 14px;border-radius:13px;background:#123b2d;color:#fff;font-size:14px;font-weight:700}.actions a.secondary{background:#edf0ed;color:#223129}@media(prefers-color-scheme:dark){html,body{background:#111411;color:#f7f8f7}section{background:#1c201d;box-shadow:none}p{color:#a4aba6}.notice{background:#322615;color:#ffc568}.bar{background:#2b302c}.actions a{background:#dff3e7;color:#123b2d}.actions a.secondary{background:#2b302c;color:#f7f8f7}}</style></head><body><main><section><div class="top"><img src="./icons/recover.svg" alt=""><h1>Recuperar Meu Dinheiro</h1></div><p id="status">Removendo somente os componentes temporários da interface.</p><div class="notice">Esta ferramenta NÃO apaga movimentações, contas, categorias ou configurações. Ela limpa somente cache e o controlador da interface.</div><div class="bar" id="bar"><span></span></div><div class="actions" id="actions" hidden><a href="./launch.html?v=1.1.2&recover=1">Abrir novamente</a><a class="secondary" href="./safe.html?v=1.1.2&recover=1">Abrir modo seguro</a><a class="secondary" href="./menu.html">Voltar ao menu</a></div></section></main><script>(async()=>{const PREFIX='meu-dinheiro-oficial-',status=document.getElementById('status'),actions=document.getElementById('actions'),bar=document.getElementById('bar'),basePath=new URL('./',location.href).pathname;try{let workers=0,cachesRemoved=0;if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();const targets=regs.filter(r=>{try{return new URL(r.scope).pathname===basePath}catch(_){return false}});const rs=await Promise.allSettled(targets.map(r=>r.unregister()));workers=rs.filter(r=>r.status==='fulfilled'&&r.value).length}if('caches'in window){const keys=await caches.keys();const targets=keys.filter(k=>k.startsWith(PREFIX));const rs=await Promise.allSettled(targets.map(k=>caches.delete(k)));cachesRemoved=rs.filter(r=>r.status==='fulfilled'&&r.value).length}status.className='ok';status.textContent=`Interface recuperada: ${workers} controlador(es) removido(s) e ${cachesRemoved} cache(s) removido(s). Seus dados foram preservados.`;bar.hidden=true;actions.hidden=false;try{localStorage.setItem(PREFIX+'last-recovery',new Date().toISOString())}catch(_){}}catch(err){status.className='bad';status.textContent='A limpeza automática não terminou. Seus dados não foram apagados. Use o modo seguro para verificar o armazenamento.';bar.hidden=true;actions.hidden=false}})();</script><script data-md-recovery-timeout>
setTimeout(() => {
  const status = document.getElementById("status");
  const bar = document.getElementById("bar");
  const actions = document.getElementById("actions");
  if (!actions || !actions.hidden) return;
  if (status) status.textContent = "O Safari ainda está encerrando componentes antigos em segundo plano. Seus dados foram preservados e você já pode continuar.";
  if (bar) bar.hidden = true;
  actions.hidden = false;
}, 2000);
</script>
</body></html>
