<!doctype html><html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f7f4"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><meta name="robots" content="noindex,nofollow">
<link rel="icon" href="./icons/launch.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="./apple-touch-icon.png"><title>Meu Dinheiro Beta · Inicializador</title>
<style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f6f7f4;color:#101412;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif}body{min-height:100dvh;display:grid;place-items:center;padding:24px}main{width:min(100%,360px);text-align:center}.mark{width:66px;height:66px;margin:0 auto 15px;border-radius:20px;background:#fff;display:grid;place-items:center;box-shadow:0 10px 30px rgba(0,0,0,.07)}.mark img{width:58px;height:58px}h1{font-size:24px;margin:0 0 7px}.status{font-size:14px;color:#6b726e;line-height:1.45;margin:0}.env{font-size:11px;font-weight:800;letter-spacing:.05em;color:#3478F6;margin-top:8px}.bar{height:5px;background:#dde3df;border-radius:999px;overflow:hidden;margin:18px 36px}.bar span{display:block;width:35%;height:100%;background:#3478F6;border-radius:inherit;animation:move 1s ease-in-out infinite alternate}@keyframes move{to{transform:translateX(185%)}}.menu{display:inline-block;margin-top:7px;color:#66706a;font-size:12px;text-decoration:none}@media(prefers-color-scheme:dark){html,body{background:#111411;color:#f7f8f7}.mark{background:#1c201d}.status,.menu{color:#a4aba6}.bar{background:#2b302c}}</style>
</head><body><main><div class="mark"><img src="./icons/launch.svg" alt=""></div><h1>Meu Dinheiro Beta</h1><p class="status" id="status">Preparando uma abertura limpa…</p><p class="env">BETA · dados isolados · 1.2.0-beta.63</p><div class="bar"><span></span></div><a class="menu" href="../menu.html">Abrir menu de ferramentas</a></main>
<script>(()=>{const RELEASE='1.2.0-beta.63',PREFIX='meu-dinheiro-beta-',status=document.getElementById('status');const cleanupKey=`${PREFIX}launch-clean-${RELEASE}`;const basePath=new URL('./',location.href).pathname;async function clean(){let needs=true;try{needs=localStorage.getItem(cleanupKey)!=='1'}catch(_){}if(!needs)return;try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.allSettled(regs.filter(r=>{try{return new URL(r.scope).pathname===basePath}catch(_){return false}}).map(r=>r.unregister()))}if('caches'in window){const keys=await caches.keys();await Promise.allSettled(keys.filter(k=>k.startsWith(PREFIX)).map(k=>caches.delete(k)))}try{localStorage.setItem(cleanupKey,'1')}catch(_){}}catch(_){}}(async()=>{const safety=setTimeout(()=>{status.textContent='Ambiente web: limpeza em segundo plano. Abrindo mesmo assim…';location.replace(`./?v=${encodeURIComponent(RELEASE)}&launch=${Date.now()}&runtime=background`)},1900);await clean();clearTimeout(safety);status.textContent='Abrindo a interface…';setTimeout(()=>location.replace(`./?v=${encodeURIComponent(RELEASE)}&launch=${Date.now()}`),90)})()})();</script></body></html>
